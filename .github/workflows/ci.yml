name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the generated game data reference is up to date
        run: |
          npm run docs
          git diff --exit-code docs/GAME_DATA.md || { echo "::error::docs/GAME_DATA.md is out of date. Run 'npm run docs' and commit the result."; exit 1; }
