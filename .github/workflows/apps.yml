name: App builds

# Builds the Windows, macOS, Linux and Android apps plus a zip of the web
# version. Pushing a tag like `v0.1.0`, or running this workflow from the
# Actions tab with a version, also publishes them on a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a release for this version (must match package.json, e.g. 0.1.0). Leave empty to only build.'
        required: false
        default: ''
  pull_request:
    paths:
      - 'electron/**'
      - 'android/**'
      - 'build/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/apps.yml'

permissions:
  contents: read

jobs:
  desktop:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            flag: --linux
          - name: Windows
            os: windows-latest
            flag: --win
          - name: macOS
            os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:desktop -- ${{ matrix.flag }}
        env:
          # Builds are unsigned; don't look for signing certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Artifacts only pass files to the release job: skip them on PRs and keep them a day.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Unbound-Underworld-${{ matrix.name }}
          retention-days: 1
          # latest*.yml and the blockmaps tell the in-app updater what to download.
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  android:
    name: Package (Android)
    runs-on: ubuntu-latest
    env:
      # Optional: with these secrets set the APK is release-signed with your key,
      # so new versions install over old ones. Without them it is debug-signed.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
      - name: Prepare signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        run: |
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            APK=app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew --no-daemon assembleDebug
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          VERSION=$(node -p "require('../package.json').version")
          mkdir -p ../release
          cp "$APK" "../release/Unbound-Underworld-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Unbound-Underworld-Android
          retention-days: 1
          path: release/*.apk
          if-no-files-found: error
      # Google Play needs an app bundle signed with your key. This build leaves
      # updates to the Play Store, so it has no in-game update button.
      - name: Build Play Store bundle
        if: env.ANDROID_KEYSTORE_PATH != ''
        env:
          VITE_DISTRIBUTION: play
        run: |
          npm run android:sync
          cd android
          ./gradlew --no-daemon bundleRelease
          VERSION=$(node -p "require('../package.json').version")
          mkdir -p ../play
          cp app/build/outputs/bundle/release/app-release.aab "../play/Unbound-Underworld-$VERSION-play.aab"
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_PATH != '' && github.event_name != 'pull_request'
        with:
          name: Play-Store-Bundle
          retention-days: 7
          path: play/*.aab
          if-no-files-found: error

  web:
    name: Package (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # index.html sits at the root of the zip, as itch.io and other static hosts expect.
      - name: Zip the web version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          (cd dist && zip -qr "../release/Unbound-Underworld-$VERSION-web.zip" .)
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Unbound-Underworld-Web
          retention-days: 1
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [desktop, android, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - name: Check the version matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Release $TAG does not match package.json ($expected). Bump the version in package.json first."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # The Play Store bundle is for uploading to Google Play, not for players.
          pattern: Unbound-Underworld-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Unbound Underworld ${{ env.TAG }}
          files: artifacts/*
          generate_release_notes: true
      # The files now live on the release, so free the Actions storage they used.
      - name: Delete this run's installer artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id: context.runId, per_page: 100 });
            for (const a of data.artifacts) {
              if (a.name.startsWith('Unbound-Underworld-')) await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: a.id });
            }
