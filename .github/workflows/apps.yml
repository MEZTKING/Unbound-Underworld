name: App builds

# Builds the Windows, macOS, Linux and Android apps. Pushing a tag like
# `v0.1.0` also publishes them as downloads on a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron/**'
      - 'android/**'
      - 'build/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/apps.yml'

permissions:
  contents: read

jobs:
  desktop:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            flag: --linux
          - name: Windows
            os: windows-latest
            flag: --win
          - name: macOS
            os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:desktop -- ${{ matrix.flag }}
        env:
          # Builds are unsigned; don't look for signing certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Unbound-Underworld-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  android:
    name: Package (Android)
    runs-on: ubuntu-latest
    env:
      # Optional: with these secrets set the APK is release-signed with your key,
      # so new versions install over old ones. Without them it is debug-signed.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
      - name: Prepare signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        run: |
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            APK=app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew --no-daemon assembleDebug
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          VERSION=$(node -p "require('../package.json').version")
          mkdir -p ../release
          cp "$APK" "../release/Unbound-Underworld-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Unbound-Underworld-Android
          path: release/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
